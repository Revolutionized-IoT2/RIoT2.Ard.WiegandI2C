; PlatformIO project for CI and command-line builds: pio run -d RIoT2.Ard.WiegandI2C
; The sketch stays in the repository root so the Arduino IDE can still open WiegandI2C.ino.
; ATtiny85, internal 8 MHz clock, flashed with an ISP programmer (pio run -t program).

[platformio]
src_dir = .

[env:attiny85]
platform = atmelavr
board = attiny85
framework = arduino
board_build.f_cpu = 8000000L
build_src_filter = +<*> -<.pio/> -<.git/> -<.vs/>
upload_protocol = usbasp
